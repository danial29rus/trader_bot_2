server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker may assign admin-api a new IP after a container recreation.
        # Resolve the service name dynamically instead of pinning its startup IP.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $admin_api_upstream admin-api:8000;
        proxy_pass http://$admin_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The admin shell must always be fetched fresh after a deployment.
        # Versioned assets keep their normal cache-friendly names.
        add_header Cache-Control "no-store, max-age=0" always;
    }
}
