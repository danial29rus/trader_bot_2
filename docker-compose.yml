services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lvlup}
      POSTGRES_USER: ${POSTGRES_USER:-lvlup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    env_file: .env
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-lvlup}
      PGUSER: ${POSTGRES_USER:-lvlup}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - postgres_backups:/backups
    command: >-
      sh -c 'while true; do pg_dump --format=custom --file=/backups/lvlup-$$(date +%Y%m%d-%H%M%S).dump; find /backups -type f -mtime +$${BACKUP_KEEP_DAYS} -delete; sleep $${BACKUP_INTERVAL_SECONDS}; done'
    restart: unless-stopped

  admin-api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lvlup:change_me@db:5432/lvlup}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
    command: uvicorn admin_api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: ./admin_web
    depends_on:
      admin-api:
        condition: service_started
    ports:
      - "${ADMIN_WEB_BIND:-127.0.0.1}:${ADMIN_WEB_PORT:-8081}:80"
    restart: unless-stopped

  caddy:
    image: caddy:2.11.6-alpine
    profiles: ["public"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      admin-web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_backups:
  caddy_data:
  caddy_config:
